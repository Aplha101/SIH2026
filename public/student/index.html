<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <header class="brand">
            <h1>Welcome Back, <span id="student-name">Student</span>!</h1>
            <p class="brand-subtitle">Student Portal</p>
        </header>

        <div class="container" style="grid-template-columns: 1fr 1fr; margin-top: 2rem;">
            <!-- Counselor & Status Card -->
            <div class="login-card">
                <div class="login-header">
                    <h2>Your Counselor</h2>
                    <p id="counselor-info">Loading counselor details...</p>
                </div>
                <a href="/dialogue.html" class="login-btn" style="display: block; text-align: center; text-decoration: none;">
                    Open Dialogue / Chat
                </a>
            </div>

            <!-- Appointments Card -->
            <div class="login-card">
                <div class="login-header">
                    <h2>Upcoming Sessions</h2>
                    <ul id="appointment-list" style="list-style: none; padding: 0;">
                        <li>No upcoming sessions scheduled.</li>
                    </ul>
                </div>
                <button class="login-btn" id="book-session-btn">Book New Session</button>
            </div>
        </div>
    </div>

    <script src="js/student-dashboard.js"></script>
</body>
</html>
